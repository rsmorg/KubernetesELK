apiVersion: v1
kind: Service
metadata:
  name: order-api
  namespace: application
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: k8s-order-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP