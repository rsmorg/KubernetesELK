apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-api
  namespace: application
  labels:
    app.kubernetes.io/name: order-api
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: k8s-order-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-api
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: k8s-order-platform
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: order-api
          image: k8s-order-platform/order-api:0.1.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: order-api-config
            - secretRef:
                name: order-api-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3