apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: order-platform-es
  namespace: observability
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/part-of: k8s-order-platform
spec:
  version: 9.2.0

  nodeSets:
    - name: default
      count: 1

      config:
        node.store.allow_mmap: false

      podTemplate:
        metadata:
          labels:
            app.kubernetes.io/name: elasticsearch
            app.kubernetes.io/component: search
        spec:
          containers:
            - name: elasticsearch
              resources:
                requests:
                  cpu: "500m"
                  memory: 1536Mi
                limits:
                  cpu: "2"
                  memory: 1536Mi
              env:
                - name: ES_JAVA_OPTS
                  value: "-Xms768m -Xmx768m"

      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi
